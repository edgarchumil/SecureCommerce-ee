[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securecommerce-advisor-backend"
version = "0.1.0"
description = "API de SecureCommerce Advisor"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pyotp>=2.9,<3",
  "reportlab>=4.2,<5",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=6,<7",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "types-reportlab>=4.4,<5",
  "bandit[toml]>=1.8,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S105"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
omit = ["app/seed.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
