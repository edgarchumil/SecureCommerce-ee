services:
  - type: keyvalue
    name: securecommerce-ee-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: securecommerce-ee-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: ./render-start.sh
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: securecommerce-ee-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: securecommerce-ee-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://securecommerce-ee.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: REPORT_STORAGE_PATH
        value: /data/reports
      - key: REPORT_EXECUTION_MODE
        value: background
      - key: AI_ENABLED
        value: "false"
      - key: DEMO_PASSWORD
        generateValue: true

  - type: web
    name: securecommerce-ee
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://securecommerce-ee-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: securecommerce-ee-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: securecommerce
    user: securecommerce
    ipAllowList: []
